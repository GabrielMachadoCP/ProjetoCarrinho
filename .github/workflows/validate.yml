name: Validar DrenaHub

on:
  push:
    branches: [main]
  pull_request:

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r tinyml/requirements.txt
          pip install platformio

      - name: Reproduzir modelo baseline
        run: python tinyml/train_drenahub_model.py

      - name: Verificar artefatos gerados
        run: >-
          git diff --exit-code --
          firmware/DrenaHub/drenahub_model.h
          tinyml/data/drenahub_training_synthetic.csv
          tinyml/model/metrics.json

      - name: Testar inferência C++
        run: |
          g++ -std=c++17 tests/model_smoke.cpp -o /tmp/drenahub_model_smoke
          /tmp/drenahub_model_smoke

      - name: Compilar firmware ESP32
        run: pio run
